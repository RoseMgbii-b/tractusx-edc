################################################################################
# Audit Registry Configuration Example
################################################################################

# Enable audit event subscriber (default: true)
tx.edc.audit.enabled=true

# Thread pool size for async audit processing (default: 2)
tx.edc.audit.thread.pool.size=2

################################################################################
# PostgreSQL Configuration for Audit Store
################################################################################

# Use default datasource or specify a dedicated audit datasource
edc.sql.store.audit.datasource=default

# If using a dedicated datasource for audit (recommended for large deployments)
# edc.sql.store.audit.datasource=audit
# edc.datasource.audit.url=jdbc:postgresql://localhost:5432/edc_audit
# edc.datasource.audit.user=audit_user
# edc.datasource.audit.password=secure_password

################################################################################
# Redis Cache Configuration (Optional but Recommended)
################################################################################

# Enable Redis caching for fast access to recent critical audit entries
tx.edc.audit.redis.enabled=true

# Redis connection settings
tx.edc.audit.redis.host=localhost
tx.edc.audit.redis.port=6379

# Redis authentication (if required)
# tx.edc.audit.redis.password=your_redis_password

# Cache TTL in seconds (default: 3600 = 1 hour)
# Adjust based on your query patterns
tx.edc.audit.redis.ttl=3600

################################################################################
# Security and Compliance Notes
################################################################################

# 1. ENCRYPTION
#    Configure PostgreSQL encryption at the database level:
#    - Enable SSL/TLS for connections
#    - Use Transparent Data Encryption (TDE) for the entire database
#    - Or use pgcrypto extension for column-level encryption
#
# 2. IMMUTABILITY
#    Implement immutability using PostgreSQL Row-level Security:
#    ALTER TABLE edc_audit_entry ENABLE ROW LEVEL SECURITY;
#    CREATE POLICY audit_immutable ON edc_audit_entry FOR UPDATE USING (false);
#    CREATE POLICY audit_no_delete ON edc_audit_entry FOR DELETE USING (false);
#
# 3. RETENTION
#    Configure automated retention policies based on your compliance requirements.
#    Example: 7-year retention for financial compliance
#    Schedule periodic cleanup jobs or use pg_cron extension.
#
# 4. ACCESS CONTROL
#    Use separate database users with minimal privileges:
#    - Audit writer: INSERT only on edc_audit_entry
#    - Audit reader: SELECT only on edc_audit_entry
#    - Audit admin: Full access for maintenance and compliance exports

################################################################################
# Production Deployment Recommendations
################################################################################

# 1. Use a dedicated PostgreSQL instance or database for audit data
# 2. Enable Redis for high-volume deployments
# 3. Configure appropriate indexes based on your query patterns
# 4. Set up monitoring and alerting for audit system health
# 5. Implement regular backup procedures for audit data
# 6. Test disaster recovery procedures
# 7. Configure PostgreSQL for high availability if required
# 8. Monitor disk space usage and plan for capacity growth

################################################################################
# Performance Tuning
################################################################################

# Increase thread pool size for high-volume environments
# tx.edc.audit.thread.pool.size=4

# Adjust Redis TTL based on cache hit ratio
# - Lower TTL (e.g., 1800s) if cache hit ratio is low
# - Higher TTL (e.g., 7200s) if most queries access recent data

# PostgreSQL tuning:
# - Increase shared_buffers for better query performance
# - Configure appropriate max_connections
# - Enable query logging for optimization analysis
# - Use connection pooling (e.g., PgBouncer) for large deployments
