web.http.port=28080
web.http.path=/api
web.http.protocol.port=28081
web.http.protocol.path=/protocol
web.http.control.port=28082
web.http.control.path=/control

edc.dataplane.token.validation.endpoint=http://localhost:28082/control/token
edc.dsp.callback.address=http://localhost:28081/protocol

# Meta
edc.connector.name=Development Tractus-X Connector
edc.hostname=localhost

# Participant Identity
tractusx.edc.participant.bpn=BPNL1234567890ZZ
edc.iam.issuer.id=did:web:localhost:dev-connector

# Vault
edc.vault=memory-vault
tx.edc.vault.secrets=key1:secret1;private-key:dev-key;public-key:dev-key;client-secret:dev-secret-123

# Token Configuration
edc.transfer.proxy.token.signer.privatekey.alias=private-key
edc.transfer.proxy.token.verifier.publickey.alias=public-key

# STS OAuth
edc.iam.sts.oauth.token.url=https://sts.catena-x.net/token
edc.iam.sts.oauth.client.id=dev-client
edc.iam.sts.oauth.client.secret.alias=client-secret

# BDRS Configuration
tx.iam.iatp.bdrs.server.url=https://bdrs.catena-x.net

# Identity & Trust
edc.iam.trusted-issuer.id=did:web:localhost:dev-connector
edc.iam.trusted-issuer.id.id=did:web:localhost:dev-connector

# JSON-LD Configuration
edc.jsonld.https.enabled=true
edc.jsonld.https.verification=false
edc.jsonld.http.enabled=true
edc.jsonld.cache.enabled=true
edc.jsonld.context.https.fallback=http

# OAuth2 Configuration
edc.oauth.provider.jwks.url=https://devsoft.ceptra.org/realms/ceptra/protocol/openid-connect/certs
edc.oauth.provider.issuer=https://devsoft.ceptra.org/realms/ceptra
edc.oauth.provider.audience=account

# Management API OAuth2 Authentication (Required properties for DAC)
web.http.management.auth.type=delegated
web.http.management.auth.dac.key.url=https://devsoft.ceptra.org/realms/ceptra/protocol/openid-connect/certs
web.http.management.auth.dac.audience=account

# Disable API key authentication
web.api.auth.key=

# JSON-LD Contexts
edc.jsonld.context.dspace.v08=https://w3id.org/dspace/v0.8/context.json
edc.jsonld.context.dspace.20241=https://w3id.org/dspace/2024/1/context.json
edc.jsonld.context.dspace.20251=https://w3id.org/dspace/2025/1/context.json

# Development
edc.keystore=
edc.keystore.password=